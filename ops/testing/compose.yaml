name: learning-platform-tests
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: learning_platform_test
      POSTGRES_USER: test_runner
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_runner -d learning_platform_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
