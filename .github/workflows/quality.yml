name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web -t lib/main.dart --dart-define=API_BASE_URL=https://staging-api.example.invalid

  cms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --dart-define=APP_ENV=production --dart-define=API_BASE_URL=https://api.example.invalid

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: learning_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      LEARNING_PLATFORM_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/learning_platform_test
      POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/learning_platform_test
      LEARNING_PLATFORM_ENVIRONMENT: test
      REDIS_TEST_URL: redis://localhost:6379/15
      LEARNING_PLATFORM_REDIS_URL: redis://localhost:6379/15
      REQUIRE_INTEGRATION_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: ruff format --check app tests alembic
        working-directory: backend
      - run: ruff check app tests alembic
        working-directory: backend
      - run: python -m compileall -q app tests alembic
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: pytest -o addopts='' -q --junitxml=test-results.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
      - run: docker build -t learning-platform-api:ci .
        working-directory: backend
