[project]
name = "learning-platform-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.7",
  "argon2-cffi>=23.1",
  "PyJWT>=2.10",
  "email-validator>=2.2",
  "httpx>=0.28",
  "app-store-server-library>=3.1.2,<4",
  "google-auth>=2.40",
  "stripe>=14,<15",
  "redis>=5.2",
  "sentry-sdk[fastapi]>=2.20",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28", "aiosqlite>=0.20", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
